# Browser tests: a project of its own, with its own database and port, so the tests never touch
# the data of the dev stack. See `make e2e`.
name: planny-e2e

services:
  bff:
    environment:
      # Every browser of a run logs in from one address, and each test makes its own users.
      PLANNY_LOGIN_RATE_LIMIT: 1000
    ports:
      - "127.0.0.1:18080:8080"
