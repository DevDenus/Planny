# Throwaway PostgreSQL for backend tests: `make test-db`. Data lives in memory.
name: planny-test

services:
  test-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: planny
      POSTGRES_PASSWORD: planny
      POSTGRES_DB: planny_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planny -d planny_test"]
      interval: 1s
      timeout: 3s
      retries: 30
